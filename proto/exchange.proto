syntax = "proto3";

package exchange;

option go_package = "github.com/knqu/goexchange/internal/pb;pb";

// ExchangeService is the order entry and execution report API called by trading agents.
// Agents are identified by "agent-id" request metadata rather than a message field.
service ExchangeService {
  // SubmitOrder queues a new order and returns its exchange-assigned ID.
  rpc SubmitOrder(SubmitOrderRequest) returns (SubmitOrderResponse);

  // CancelOrder queues a cancellation of a resting order.
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);

  // StreamExecutionReports streams the calling agent's execution reports (until either side disconnects).
  rpc StreamExecutionReports(StreamExecutionReportsRequest) returns (stream StreamExecutionReportsResponse);
}

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_LIMIT = 1;
  ORDER_TYPE_MARKET = 2;
}

enum TIF {
  TIF_UNSPECIFIED = 0;
  TIF_DAY = 1;
  TIF_IOC = 2;
  TIF_FOK = 3;
}

message SubmitOrderRequest {
  string symbol = 1;
  Side side = 2;
  OrderType type = 3;
  TIF tif = 4;
  int64 price = 5; // in cents; must be 0 for market orders
  int64 quantity = 6;
}

message SubmitOrderResponse {
  uint64 order_id = 1;
}

message CancelOrderRequest {
  string symbol = 1;
  uint64 order_id = 2;
}

message CancelOrderResponse {}

message StreamExecutionReportsRequest {}

message StreamExecutionReportsResponse {
  uint64 seq = 1; // per-agent; increments by exactly 1 per message (a gap means reports were lost)

  oneof report {
    Fill fill = 2;
  }
}

// Fill notifies an agent that one of its orders traded (either fully or partially).
message Fill {
  uint64 order_id = 1;
  string symbol = 2;
  Side side = 3;
  int64 price = 4;
  int64 quantity = 5;
}
